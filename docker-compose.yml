services:
  redis:
    image: redis:7-alpine
    container_name: smartserve-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - smartserve-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smartserve-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - smartserve-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  seq:
    image: datalust/seq:latest
    container_name: smartserve-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "${SEQ_FIRSTRUN_NOAUTHENTICATION:-false}"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_FIRSTRUN_ADMINPASSWORD:-ChangeMe_SeqAdmin_2026!}"
    ports:
      - "${SEQ_PORT:-5341}:5341"
      - "${SEQ_UI_PORT:-5342}:80"
    volumes:
      - smartserve-seq-data:/data

  identity-service:
    build:
      context: .
      dockerfile: services/identity/host/ResourceryPlatformWorkflow.IdentityService.HttpApi.Host/Dockerfile
    image: smartserve/identity-service:local
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${ASPNET_DEV_CERT_PASSWORD:-dev_cert_2026!}"
      App__SelfUrl: "https://localhost:${IDENTITY_SERVICE_PORT:-7002}"
      ConnectionStrings__ResourceryPlatformWorkflowAdministrationDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_AdministrationDb;"
      ConnectionStrings__ResourceryPlatformWorkflowIdentityServiceDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_IdentityServiceDb;"
      ConnectionStrings__ResourceryPlatformWorkflowSaaSDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_SaaSDb;"
      ConnectionStrings__ResourceryPlatformWorkflowWorkflowDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_WorkflowDb;"
      ConnectionStrings__redis: "${REDIS_HOST:-smartserve-redis}:${REDIS_PORT_INTERNAL:-6379}"
      ConnectionStrings__seq: "${SEQ_URL:-http://smartserve-seq:5341}"
      RabbitMQ__Connections__Default__HostName: "${RABBITMQ_HOST:-smartserve-rabbitmq}"
      RabbitMQ__Connections__Default__Port: "${RABBITMQ_PORT_INTERNAL:-5672}"
      RabbitMQ__Connections__Default__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMQ__Connections__Default__Password: "${RABBITMQ_PASSWORD:-guest}"
      App__CorsOrigins: "${APP_CORS_ORIGINS:-http://localhost:4200,https://localhost:4200,https://localhost:7001,https://localhost:7002,https://localhost:7003,https://localhost:7004,https://localhost:7500}"
    ports:
      - "${IDENTITY_SERVICE_PORT:-7002}:8443"
    volumes:
      - ${ASPNET_HTTPS_CERT_DIR:-~/.aspnet/https}:/https:ro

  administration-service:
    build:
      context: .
      dockerfile: services/administration/host/ResourceryPlatformWorkflow.Administration.HttpApi.Host/Dockerfile
    image: smartserve/administration-service:local
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
      identity-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${ASPNET_DEV_CERT_PASSWORD:-dev_cert_2026!}"
      App__SelfUrl: "https://localhost:${ADMINISTRATION_SERVICE_PORT:-7001}"
      AuthServer__Authority: "${IDENTITY_SERVICE_INTERNAL_URL:-http://identity-service:8080/}"
      AuthServer__RequireHttpsMetadata: "false"
      ConnectionStrings__ResourceryPlatformWorkflowAdministrationDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_AdministrationDb;"
      ConnectionStrings__ResourceryPlatformWorkflowIdentityServiceDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_IdentityServiceDb;"
      ConnectionStrings__ResourceryPlatformWorkflowSaaSDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_SaaSDb;"
      ConnectionStrings__ResourceryPlatformWorkflowWorkflowDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_WorkflowDb;"
      ConnectionStrings__redis: "${REDIS_HOST:-smartserve-redis}:${REDIS_PORT_INTERNAL:-6379}"
      ConnectionStrings__seq: "${SEQ_URL:-http://smartserve-seq:5341}"
      RabbitMQ__Connections__Default__HostName: "${RABBITMQ_HOST:-smartserve-rabbitmq}"
      RabbitMQ__Connections__Default__Port: "${RABBITMQ_PORT_INTERNAL:-5672}"
      RabbitMQ__Connections__Default__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMQ__Connections__Default__Password: "${RABBITMQ_PASSWORD:-guest}"
      App__CorsOrigins: "${APP_CORS_ORIGINS:-http://localhost:4200,https://localhost:4200,https://localhost:7001,https://localhost:7002,https://localhost:7003,https://localhost:7004,https://localhost:7500}"
    ports:
      - "${ADMINISTRATION_SERVICE_PORT:-7001}:8443"
    volumes:
      - ${ASPNET_HTTPS_CERT_DIR:-~/.aspnet/https}:/https:ro

  saas-service:
    build:
      context: .
      dockerfile: services/saas/host/ResourceryPlatformWorkflow.SaaS.HttpApi.Host/Dockerfile
    image: smartserve/saas-service:local
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
      identity-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${ASPNET_DEV_CERT_PASSWORD:-dev_cert_2026!}"
      App__SelfUrl: "https://localhost:${SAAS_SERVICE_PORT:-7003}"
      AuthServer__Authority: "${IDENTITY_SERVICE_INTERNAL_URL:-http://identity-service:8080/}"
      AuthServer__RequireHttpsMetadata: "false"
      ConnectionStrings__ResourceryPlatformWorkflowAdministrationDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_AdministrationDb;"
      ConnectionStrings__ResourceryPlatformWorkflowIdentityServiceDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_IdentityServiceDb;"
      ConnectionStrings__ResourceryPlatformWorkflowSaaSDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_SaaSDb;"
      ConnectionStrings__ResourceryPlatformWorkflowWorkflowDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_WorkflowDb;"
      ConnectionStrings__redis: "${REDIS_HOST:-smartserve-redis}:${REDIS_PORT_INTERNAL:-6379}"
      ConnectionStrings__seq: "${SEQ_URL:-http://smartserve-seq:5341}"
      RabbitMQ__Connections__Default__HostName: "${RABBITMQ_HOST:-smartserve-rabbitmq}"
      RabbitMQ__Connections__Default__Port: "${RABBITMQ_PORT_INTERNAL:-5672}"
      RabbitMQ__Connections__Default__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMQ__Connections__Default__Password: "${RABBITMQ_PASSWORD:-guest}"
      App__CorsOrigins: "${APP_CORS_ORIGINS:-http://localhost:4200,https://localhost:4200,https://localhost:7001,https://localhost:7002,https://localhost:7003,https://localhost:7004,https://localhost:7500}"
    ports:
      - "${SAAS_SERVICE_PORT:-7003}:8443"
    volumes:
      - ${ASPNET_HTTPS_CERT_DIR:-~/.aspnet/https}:/https:ro

  workflow-service:
    build:
      context: .
      dockerfile: services/workflow/host/ResourceryPlatformWorkflow.Workflow.HttpApi.Host/Dockerfile
    image: smartserve/workflow-service:local
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
      identity-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      ASPNETCORE_URLS: "http://+:8080;https://+:8443"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${ASPNET_DEV_CERT_PASSWORD:-dev_cert_2026!}"
      App__SelfUrl: "https://localhost:${WORKFLOW_SERVICE_PORT:-7004}"
      AuthServer__Authority: "${IDENTITY_SERVICE_INTERNAL_URL:-http://identity-service:8080/}"
      AuthServer__RequireHttpsMetadata: "false"
      RemoteServices__Default__BaseUrl: "${IDENTITY_SERVICE_INTERNAL_URL:-http://identity-service:8080/}"
      RemoteServices__IdentityService__BaseUrl: "${IDENTITY_SERVICE_INTERNAL_URL:-http://identity-service:8080/}"
      ConnectionStrings__ResourceryPlatformWorkflowAdministrationDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_AdministrationDb;"
      ConnectionStrings__ResourceryPlatformWorkflowIdentityServiceDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_IdentityServiceDb;"
      ConnectionStrings__ResourceryPlatformWorkflowSaaSDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_SaaSDb;"
      ConnectionStrings__ResourceryPlatformWorkflowWorkflowDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_WorkflowDb;"
      ConnectionStrings__redis: "${REDIS_HOST:-smartserve-redis}:${REDIS_PORT_INTERNAL:-6379}"
      ConnectionStrings__seq: "${SEQ_URL:-http://smartserve-seq:5341}"
      RabbitMQ__Connections__Default__HostName: "${RABBITMQ_HOST:-smartserve-rabbitmq}"
      RabbitMQ__Connections__Default__Port: "${RABBITMQ_PORT_INTERNAL:-5672}"
      RabbitMQ__Connections__Default__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMQ__Connections__Default__Password: "${RABBITMQ_PASSWORD:-guest}"
      App__CorsOrigins: "${APP_CORS_ORIGINS:-http://localhost:4200,https://localhost:4200,https://localhost:7001,https://localhost:7002,https://localhost:7003,https://localhost:7004,https://localhost:7500}"
    ports:
      - "${WORKFLOW_SERVICE_PORT:-7004}:8443"
    volumes:
      - ${ASPNET_HTTPS_CERT_DIR:-~/.aspnet/https}:/https:ro

  auth-server:
    build:
      context: .
      dockerfile: apps/ResourceryPlatformWorkflow.AuthServer/Dockerfile
    image: smartserve/auth-server:local
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      ASPNETCORE_URLS: "https://+:7600"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${ASPNET_DEV_CERT_PASSWORD:-dev_cert_2026!}"
      App__SelfUrl: "https://localhost:${AUTH_SERVER_PORT:-7600}"
      App__ClientUrl: "http://localhost:${ANGULAR_WEB_PORT:-4200}"
      App__CorsOrigins: "${APP_CORS_ORIGINS:-http://localhost:4200,https://localhost:4200,https://localhost:7001,https://localhost:7002,https://localhost:7003,https://localhost:7004,https://localhost:7500}"
      App__RedirectAllowedUrls: "http://localhost:${ANGULAR_WEB_PORT:-4200},https://localhost:${ANGULAR_WEB_PORT:-4200}"
      ConnectionStrings__ResourceryPlatformWorkflowAdministrationDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_AdministrationDb;Pooling=false;"
      ConnectionStrings__ResourceryPlatformWorkflowIdentityServiceDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_IdentityServiceDb;Pooling=false;"
      ConnectionStrings__ResourceryPlatformWorkflowSaaSDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_SaaSDb;Pooling=false;"
      ConnectionStrings__ResourceryPlatformWorkflowWorkflowDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_WorkflowDb;Pooling=false;"
      ConnectionStrings__redis: "${REDIS_HOST:-smartserve-redis}:${REDIS_PORT_INTERNAL:-6379}"
      ConnectionStrings__seq: "${SEQ_URL:-http://smartserve-seq:5341}"
      RabbitMQ__Connections__Default__HostName: "${RABBITMQ_HOST:-smartserve-rabbitmq}"
      RabbitMQ__Connections__Default__Port: "${RABBITMQ_PORT_INTERNAL:-5672}"
      RabbitMQ__Connections__Default__UserName: "${RABBITMQ_USER:-guest}"
      RabbitMQ__Connections__Default__Password: "${RABBITMQ_PASSWORD:-guest}"
      OAuth__ClientId: "${OAUTH_CLIENT_ID}"
      OAuth__ClientSecret: "${OAUTH_CLIENT_SECRET}"
      TenantId: "${OAUTH_TENANT_ID}"
    ports:
      - "${AUTH_SERVER_PORT:-7600}:7600"
    volumes:
      - ${ASPNET_HTTPS_CERT_DIR:-~/.aspnet/https}:/https:ro

  gateway:
    build:
      context: .
      dockerfile: gateway/ResourceryPlatformWorkflow.Gateway/Dockerfile
    image: smartserve/gateway:local
    depends_on:
      identity-service:
        condition: service_started
      administration-service:
        condition: service_started
      saas-service:
        condition: service_started
      workflow-service:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      ASPNETCORE_URLS: "https://+:8081"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/aspnetapp.pfx"
      ASPNETCORE_Kestrel__Certificates__Default__Password: "${ASPNET_DEV_CERT_PASSWORD:-dev_cert_2026!}"
      App__SelfUrl: "https://localhost:${GATEWAY_PORT:-7500}"
      App__CorsOrigins: "${APP_CORS_ORIGINS:-http://localhost:4200,https://localhost:4200,https://localhost:7001,https://localhost:7002,https://localhost:7003,https://localhost:7004,https://localhost:7500,https://localhost:7600}"
      ReverseProxy__Clusters__administration__Destinations__administration__Address: "https://host.docker.internal:7001"
      ReverseProxy__Clusters__identity__Destinations__identity__Address: "https://host.docker.internal:7002"
      ReverseProxy__Clusters__account__Destinations__account__Address: "https://host.docker.internal:7002"
      ReverseProxy__Clusters__saas__Destinations__saas__Address: "https://host.docker.internal:7003"
      ReverseProxy__Clusters__workflow__Destinations__workflow__Address: "https://host.docker.internal:7004"
      ReverseProxy__Clusters__administration__HttpClient__DangerousAcceptAnyServerCertificate: "true"
      ReverseProxy__Clusters__identity__HttpClient__DangerousAcceptAnyServerCertificate: "true"
      ReverseProxy__Clusters__account__HttpClient__DangerousAcceptAnyServerCertificate: "true"
      ReverseProxy__Clusters__saas__HttpClient__DangerousAcceptAnyServerCertificate: "true"
      ReverseProxy__Clusters__workflow__HttpClient__DangerousAcceptAnyServerCertificate: "true"
    ports:
      - "${GATEWAY_PORT:-7500}:8081"
    volumes:
      - ${ASPNET_HTTPS_CERT_DIR:-~/.aspnet/https}:/https:ro

  migrations:
    build:
      context: .
      dockerfile: shared/ResourceryPlatformWorkflow.DbMigrator/Dockerfile
    image: smartserve/db-migrator:local
    profiles: ["migrations"]
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      ConnectionStrings__ResourceryPlatformWorkflowAdministrationDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_AdministrationDb;"
      ConnectionStrings__ResourceryPlatformWorkflowIdentityServiceDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_IdentityServiceDb;"
      ConnectionStrings__ResourceryPlatformWorkflowSaaSDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_SaaSDb;"
      ConnectionStrings__ResourceryPlatformWorkflowWorkflowDb: "Server=${SQLSERVER_HOST:-CONF-AJCHIGBU},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_WorkflowDb;"

  web:
    build:
      context: .
      dockerfile: apps/ResourceryPlatformWeb/Dockerfile
    image: smartserve/web:local
    depends_on:
      identity-service:
        condition: service_started
      gateway:
        condition: service_started
    ports:
      - "${ANGULAR_WEB_PORT:-4200}:80"

volumes:
  smartserve-redis-data:
  smartserve-rabbitmq-data:
  smartserve-seq-data:
