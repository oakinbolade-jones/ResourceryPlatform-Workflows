      App__CorsOrigins: https://smartserve.ecowas.int,https://api.smartserve.ecowas.int
      AuthServer__Authority: https://auth.smartserve.ecowas.int
      # Database connection strings
      ConnectionStrings__ResourceryPlatformWorkflowAdministrationDb: Server=${SQLSERVER_HOST:-host.docker.internal},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_Production_AdministrationDb;Pooling=false;
      ConnectionStrings__ResourceryPlatformWorkflowIdentityServiceDb: Server=${SQLSERVER_HOST:-host.docker.internal},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_Production_IdentityServiceDb;Pooling=false;
      ConnectionStrings__ResourceryPlatformWorkflowSaaSDb: Server=${SQLSERVER_HOST:-host.docker.internal},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_Production_SaaSDb;Pooling=false;
      ConnectionStrings__ResourceryPlatformWorkflowWorkflowDb: Server=${SQLSERVER_HOST:-host.docker.internal},${SQLSERVER_PORT:-1433};User Id=${SQLSERVER_USER:-sa};Password=${SQLSERVER_PASSWORD:-P@ssw0rd123};TrustServerCertificate=True;Encrypt=False;Database=ResourceryPlatformWorkflow_Production_WorkflowDb;Pooling=false;
      # Redis, Seq, and RabbitMQ connection strings
      ConnectionStrings__Redis: ${REDIS_HOST:-smartserve-redis}:${REDIS_PORT:-6379}
      ConnectionStrings__seq: ${SEQ_URL:-http://smartserve-seq:5341}
      RabbitMQ__Connections__Default__HostName: ${RABBITMQ_HOST:-smartserve-rabbitmq}
      RabbitMQ__Connections__Default__Port: ${RABBITMQ_PORT_INTERNAL:-5672}
      RabbitMQ__Connections__Default__UserName: ${RABBITMQ_USER:-guest}
      RabbitMQ__Connections__Default__Password: ${RABBITMQ_PASSWORD:-guest}
      Serilog__MinimumLevel__Default: Information
      Serilog__WriteTo__Seq__Name: Seq
      Serilog__WriteTo__Seq__Args__serverUrl: http://smartserve-seq:5341
    # Expose the service on port 80
    expose:
      - 80
    networks:
      - smartserve-net
    restart: unless-stopped
  saas-service:
    build:
      context: .
      dockerfile: services/saas/host/ResourceryPlatformWorkflow.SaaS.HttpApi.Host/Dockerfile
    image: smartserve/saas-service:prod
    # healthcheck:
    #   test: ["CMD-SHELL", "wget --spider -q http://localhost/health || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 10
    #   start_period: 30s
    # Dependencies on Redis, RabbitMQ, Seq, and Identity Service to ensure they are healthy before starting the saas-service
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      seq:
        condition: service_started
      identity-service:
        condition: service_started
    environment:
      # ASP.NET Core environment and Kestrel settings
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: true
      App__SelfUrl: https://api.smartserve.ecowas.int
