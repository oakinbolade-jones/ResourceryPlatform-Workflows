<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preload" href="/assets/fonts/millik/Millik.otf" as="font" type="font/otf" crossorigin />
  <link rel="preload" href="/assets/fonts/millik/Millik.ttf" as="font" type="font/ttf" crossorigin />
  <title>SmartServe - Countdown to Launch</title>
  <style>
    @font-face {
      font-family: "Millik";
      src:
        url('/assets/fonts/millik/Millik.otf') format('opentype'),
        url('/assets/fonts/millik/Millik.ttf') format('truetype');
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --green-950: #052e16;
      --green-900: #14532d;
      --green-700: #15803d;
      --green-600: #16a34a;
      --green-500: #22c55e;
      --green-100: #dcfce7;
      --green-50: #f0fdf4;
      --ink: #123524;
      --muted: #587064;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(74, 222, 128, 0.28), transparent 25%),
        radial-gradient(circle at 88% 78%, rgba(34, 197, 94, 0.22), transparent 22%),
        linear-gradient(135deg, #052e16 0%, #166534 58%, #14532d 100%);
    }

    .launch-shell {
      width: min(980px, 100%);
      border: 1px solid rgba(240, 253, 244, 0.24);
      border-radius: 32px;
      background: rgba(240, 253, 244, 0.12);
      box-shadow: 0 30px 80px rgba(2, 44, 20, 0.42);
      backdrop-filter: blur(8px);
    }

    .launch-card {
      text-align: center;
      border-radius: 32px;
      padding: clamp(28px, 5vw, 60px);
      background: rgba(248, 255, 250, 0.96);
    }

    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }

    .lang-switch {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: -8px 0 20px;
    }

    .lang-button {
      border: 1px solid rgba(22, 101, 52, 0.16);
      border-radius: 999px;
      padding: 7px 11px;
      background: rgba(22, 163, 74, 0.06);
      color: var(--green-900);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-button.active {
      border-color: transparent;
      background: var(--green-900);
      color: #fff;
      box-shadow: 0 8px 18px rgba(22, 101, 52, 0.16);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding: 9px 16px;
      border: 1px solid rgba(22, 163, 74, 0.18);
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.09);
      color: var(--green-900);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green-500);
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.9);
    }

    h1 {
      margin: 0 0 14px;
      color: var(--green-900);
      font-family: "Millik", "Segoe UI", sans-serif;
      font-size: clamp(2.5rem, 5vw, 4.2rem);
      line-height: 1.06;
      letter-spacing: -0.04em;
    }

    .lead {
      max-width: 680px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.22rem);
      line-height: 1.7;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      max-width: 680px;
      margin: 0 auto 18px;
    }

    .time-unit {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(22, 163, 74, 0.16);
      border-radius: 20px;
      background: linear-gradient(145deg, #ecfdf3, #dcfce7);
      box-shadow: 0 12px 28px rgba(22, 101, 52, 0.1);
    }

    .time-unit strong {
      color: var(--green-900);
      font-family: "Millik", "Segoe UI", sans-serif;
      font-size: clamp(2.1rem, 5vw, 3.5rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .time-unit span {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .launch-date {
      margin: 8px 0 24px;
      color: var(--green-700);
      font-weight: 750;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .btn {
      display: inline-block;
      border-radius: 999px;
      padding: 14px 24px;
      color: inherit;
      font-weight: 750;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--green-900), var(--green-500));
      box-shadow: 0 12px 26px rgba(22, 163, 74, 0.24);
    }

    .btn-secondary {
      border: 1px solid rgba(22, 101, 52, 0.16);
      background: rgba(22, 163, 74, 0.07);
      color: var(--green-900);
    }

    .footer {
      padding: 16px;
      text-align: center;
      color: rgba(240, 253, 244, 0.86);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .launch-card { border-radius: 24px; }
      .launch-shell { border-radius: 24px; }
      .countdown { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .time-unit { min-height: 104px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; text-align: center; }
    }
  </style>
</head>

<body>
  <main class="launch-shell" aria-live="polite">
    <section class="launch-card">
      <div class="brand" aria-label="SmartServe">
        <img src="/assets/images/logo/ecw-smartserve-logo.png" alt="SmartServe logo" />
      </div>

      <div class="lang-switch" aria-label="Language switcher">
        <button class="lang-button active" type="button" data-lang="en">EN</button>
        <button class="lang-button" type="button" data-lang="fr">FR</button>
        <button class="lang-button" type="button" data-lang="pt">PT</button>
      </div>

      <div class="status-pill">
        <span class="status-dot" aria-hidden="true"></span>
        <span data-i18n="status">Launch countdown</span>
      </div>

      <h1 data-i18n="title">Something great is coming</h1>
      <p class="lead" data-i18n="message">
        SmartServe is preparing to launch. We are putting the final touches in place
        to bring you a faster, smarter platform experience.
      </p>

      <div class="countdown" role="timer" aria-label="Time remaining until launch">
        <div class="time-unit">
          <strong id="days">00</strong>
          <span data-i18n="days">Days</span>
        </div>
        <div class="time-unit">
          <strong id="hours">00</strong>
          <span data-i18n="hours">Hours</span>
        </div>
        <div class="time-unit">
          <strong id="minutes">00</strong>
          <span data-i18n="minutes">Minutes</span>
        </div>
        <div class="time-unit">
          <strong id="seconds">00</strong>
          <span data-i18n="seconds">Seconds</span>
        </div>
      </div>

      <p class="launch-date" id="launch-date">Launch date</p>

      <div class="actions">
        <a class="btn btn-primary" href="/" data-i18n="visit">Visit SmartServe</a>
        <a class="btn btn-secondary" href="mailto:support@smartserve.ecowas.int" data-i18n="support">Contact support</a>
      </div>
    </section>

    <footer class="footer">© 2026 SmartServe ECOWAS</footer>
  </main>

  <script>
    // SmartServe launch date: November 30, 2026 at 9:00 AM local time.
    const launchDate = new Date(2026, 10, 30, 9, 0, 0, 0);

    const translations = {
      en: {
        status: 'Launch countdown', title: 'Something great is coming',
        message: 'SmartServe is preparing to launch. We are putting the final touches in place to bring you a faster, smarter platform experience.',
        days: 'Days', hours: 'Hours', minutes: 'Minutes', seconds: 'Seconds',
        launching: 'Launching', visit: 'Visit SmartServe', support: 'Contact support',
        launchedStatus: 'We have launched', live: 'We are live', timerLabel: 'Time remaining until launch'
      },
      fr: {
        status: 'Compte à rebours du lancement', title: 'Quelque chose de grand arrive',
        message: 'SmartServe se prépare à son lancement. Nous effectuons les dernières étapes afin de vous offrir une plateforme plus rapide et plus intelligente.',
        days: 'Jours', hours: 'Heures', minutes: 'Minutes', seconds: 'Secondes',
        launching: 'Lancement prévu', visit: 'Visiter SmartServe', support: 'Contacter le support',
        launchedStatus: 'Nous avons lancé', live: 'Nous sommes en ligne', timerLabel: 'Temps restant avant le lancement'
      },
      pt: {
        status: 'Contagem regressiva para o lançamento', title: 'Algo incrível está chegando',
        message: 'O SmartServe está se preparando para o lançamento. Estamos finalizando os detalhes para oferecer uma plataforma mais rápida e inteligente.',
        days: 'Dias', hours: 'Horas', minutes: 'Minutos', seconds: 'Segundos',
        launching: 'Lançamento', visit: 'Visitar o SmartServe', support: 'Contactar o suporte',
        launchedStatus: 'Já lançamos', live: 'Estamos online', timerLabel: 'Tempo restante até ao lançamento'
      }
    };

    const locales = { en: 'en-US', fr: 'fr-FR', pt: 'pt-PT' };
    let currentLanguage = 'en';

    function detectLanguage() {
      const browserLanguage = (navigator.language || navigator.languages?.[0] || 'en').toLowerCase();
      if (browserLanguage.startsWith('fr')) return 'fr';
      if (browserLanguage.startsWith('pt')) return 'pt';
      return 'en';
    }

    function formatLaunchDate() {
      const selected = translations[currentLanguage];
      document.getElementById('launch-date').textContent =
        selected.launching + ' ' + launchDate.toLocaleString(locales[currentLanguage], {
          weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
    }

    function applyLanguage(lang) {
      currentLanguage = translations[lang] ? lang : 'en';
      const selected = translations[currentLanguage];

      document.documentElement.lang = currentLanguage;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (selected[key]) el.textContent = selected[key];
      });

      document.querySelectorAll('.lang-button').forEach(button => {
        button.classList.toggle('active', button.getAttribute('data-lang') === currentLanguage);
      });

      document.querySelector('.countdown').setAttribute('aria-label', selected.timerLabel);
      formatLaunchDate();
      updateCountdown();
    }

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function updateCountdown() {
      const remaining = launchDate.getTime() - Date.now();
      const selected = translations[currentLanguage];

      if (remaining <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        document.querySelector('[data-i18n="status"]').textContent = selected.launchedStatus;
        document.querySelector('h1').textContent = selected.live;
        return;
      }

      const totalSeconds = Math.floor(remaining / 1000);
      document.getElementById('days').textContent = pad(Math.floor(totalSeconds / 86400));
      document.getElementById('hours').textContent = pad(Math.floor((totalSeconds % 86400) / 3600));
      document.getElementById('minutes').textContent = pad(Math.floor((totalSeconds % 3600) / 60));
      document.getElementById('seconds').textContent = pad(totalSeconds % 60);
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyLanguage(detectLanguage());
      document.querySelectorAll('.lang-button').forEach(button => {
        button.addEventListener('click', () => applyLanguage(button.getAttribute('data-lang')));
      });
    });

    setInterval(updateCountdown, 1000);
  </script>
</body>

</html>
