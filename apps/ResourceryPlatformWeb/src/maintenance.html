<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preload" href="/assets/fonts/millik/Millik.otf" as="font" type="font/otf" crossorigin />
  <link rel="preload" href="/assets/fonts/millik/Millik.ttf" as="font" type="font/ttf" crossorigin />
  <title>SmartServe - Platform Unavailable</title>
  <style>
    @font-face {
      font-family: "Millik";
      src:
        url('/assets/fonts/millik/Millik.otf') format('opentype'),
        url('/assets/fonts/millik/Millik.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Millik";
      src:
        url('/assets/fonts/millik/Millik.otf') format('opentype'),
        url('/assets/fonts/millik/Millik.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --smartserve-dark: #10251b;
      --smartserve-green: #16a34a;
      --smartserve-green-light: #22c55e;
      --smartserve-green-deep: #166534;
      --smartserve-gold: #d9c77b;
      --smartserve-muted: #587064;
      --smartserve-hero: #166534;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f1720;
      color: var(--smartserve-dark);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 20%, rgba(34, 197, 94, 0.22), transparent 28%),
        radial-gradient(circle at 85% 75%, rgba(74, 222, 128, 0.18), transparent 24%),
        linear-gradient(135deg, rgba(5, 46, 22, 0.94), rgba(20, 83, 45, 0.86)),
        url('/assets/images/bacground/landing.jpg') center/cover no-repeat fixed;
    }

    .offline-shell {
      width: min(980px, calc(100% - 32px));
      background: rgba(220, 252, 231, 0.14);
      border: 1px solid rgba(220, 252, 231, 0.25);
      border-radius: 28px;
      box-shadow: 0 28px 70px rgba(4, 36, 18, 0.38);
      backdrop-filter: blur(8px);
    }

    .offline-card {
      background: rgba(248, 255, 250, 0.96);
      border-radius: 28px;
      padding: clamp(28px, 5vw, 58px);
      text-align: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand img {
      width: clamp(160px, 24vw, 280px);
      height: auto;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.1);
      color: var(--smartserve-green-deep);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid rgba(22, 163, 74, 0.18);
      margin: 0 auto 20px;
      box-shadow: 0 8px 18px rgba(22, 163, 74, 0.08);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--smartserve-green-light);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
      margin-right: 10px;
    }

    h1 {
      margin: 0 0 14px;
      font-family: "Millik", "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: clamp(2.5rem, 5vw, 4.2rem);
      line-height: 1.06;
      letter-spacing: -0.04em;
      color: var(--smartserve-hero);
    }

    .lead {
      margin: 0 auto 28px;
      max-width: 680px;
      color: var(--smartserve-muted);
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.75;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      max-width: 680px;
      margin: 0 auto 30px;
    }

    .time-unit {
      min-height: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: linear-gradient(145deg, #ecfdf3, #dcfce7);
      border: 1px solid rgba(22, 163, 74, 0.16);
      box-shadow: 0 12px 28px rgba(22, 101, 52, 0.1);
    }

    .time-unit strong {
      color: var(--smartserve-green-deep);
      font-family: "Millik", "Segoe UI", sans-serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1;
    }

    .time-unit span {
      margin-top: 10px;
      color: var(--smartserve-muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .launch-date {
      margin: -12px 0 24px;
      color: var(--smartserve-green-deep);
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 20px;
    }

    .lang-switch {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 8px 0 28px;
    }

    .lang-button {
      border: 1px solid rgba(22, 101, 52, 0.14);
      background: rgba(22, 163, 74, 0.05);
      color: var(--smartserve-dark);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-button.active {
      background: var(--smartserve-green-deep);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 18px rgba(22, 101, 52, 0.18);
    }

    .btn {
      display: inline-block;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 0.96rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--smartserve-green-deep), var(--smartserve-green-light));
      box-shadow: 0 12px 26px rgba(22, 163, 74, 0.24);
    }

    .btn-secondary {
      color: var(--smartserve-green-deep);
      background: rgba(22, 163, 74, 0.07);
      border: 1px solid rgba(22, 101, 52, 0.16);
    }

    .home-footer {
      width: 100%;
      padding: 18px 20px 8px;
      text-align: center;
      color: rgba(240, 253, 244, 0.84);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
    }

    .home-footer .container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      .countdown {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .time-unit {
        min-height: 104px;
      }

      .brand {
        flex-direction: column;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <main class="offline-shell" aria-live="polite">
    <section class="offline-card">
      <div class="lang-switch" aria-label="Language switcher">
        <button class="lang-button active" type="button" data-lang="en">EN</button>
        <button class="lang-button" type="button" data-lang="fr">FR</button>
        <button class="lang-button" type="button" data-lang="pt">PT</button>
      </div>
      <div class="brand" aria-label="SmartServe">
        <img src="/assets/images/logo/ecw-smartserve-logo.png" alt="SmartServe logo" />
        <!-- <div class="brand-mark">
          <strong>SMARTSERVE</strong>
          <span>ECOWAS platform</span>
        </div> -->
      </div>

      <div class="status-pill">
        <span class="status-dot" aria-hidden="true"></span>
        <span data-i18n="status">Platform unavailable</span>
      </div>



      <h1 data-i18n="title">We are temporarily offline</h1>
      <p class="lead" data-i18n="message">
        The SmartServe platform is currently unavailable while maintenance in progress.
        Please try again in a few minutes.
      </p>

      <div class="countdown" aria-label="Countdown to launch">
        <div class="time-unit">
          <strong id="days">00</strong>
          <span>Days</span>
        </div>
        <div class="time-unit">
          <strong id="hours">00</strong>
          <span>Hours</span>
        </div>
        <div class="time-unit">
          <strong id="minutes">00</strong>
          <span>Minutes</span>
        </div>
        <div class="time-unit">
          <strong id="seconds">00</strong>
          <span>Seconds</span>
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="/" onclick="window.location.reload(); return false;"
          data-i18n="refresh">Refresh page</a>
        <a class="btn btn-secondary" href="mailto:support@smartserve.ecowas.int" data-i18n="support">Contact support</a>
      </div>
    </section>
    <div class="home-footer" aria-label="Footer information">
      <div class="container">
        <span>© 2026 SmartServe ECOWAS</span>
        <span>•</span>
        <span data-i18n="support">Contact support</span>
      </div>
    </div>
  </main>

  <script>
    const translations = {
      en: {
        status: 'Platform unavailable',
        title: 'We are temporarily offline',
        message: 'The SmartServe platform is currently unavailable while maintenance or service restoration is in progress. Please try again in a few minutes.',
        refresh: 'Refresh page',
        support: 'Contact support'
      },
      fr: {
        status: 'Plateforme indisponible',
        title: 'Nous sommes temporairement hors ligne',
        message: 'La plateforme SmartServe est actuellement indisponible pendant la maintenance ou la restauration des services. Merci de réessayer dans quelques minutes.',
        refresh: 'Actualiser la page',
        support: 'Contacter le support'
      },
      pt: {
        status: 'Plataforma indisponível',
        title: 'Estamos temporariamente offline',
        message: 'A plataforma SmartServe está indisponível enquanto a manutenção ou a restauração do serviço está em andamento. Tente novamente em alguns minutos.',
        refresh: 'Atualizar página',
        support: 'Contactar suporte'
      }
    };

    function detectLanguage() {
      const browserLanguage = (navigator.language || navigator.languages?.[0] || 'en').toLowerCase();
      if (browserLanguage.startsWith('fr')) return 'fr';
      if (browserLanguage.startsWith('pt')) return 'pt';
      return 'en';
    }

    function applyLanguage(lang) {
      const selected = translations[lang] || translations.en;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (selected[key]) {
          el.textContent = selected[key];
        }
      });

      document.querySelectorAll('.lang-button').forEach(button => {
        button.classList.toggle('active', button.getAttribute('data-lang') === lang);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const initialLang = detectLanguage();
      applyLanguage(initialLang);

      document.querySelectorAll('.lang-button').forEach(button => {
        button.addEventListener('click', () => applyLanguage(button.getAttribute('data-lang')));
      });
    });

    // Countdown timer script
    const launchDate = new Date('2026-01-01T00:00:00Z').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = launchDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

      if (distance < 0) {
        clearInterval(countdownInterval);
        document.querySelector('.countdown').innerHTML = '<span style="color: var(--smartserve-green-deep); font-weight: 700;">Launching soon!</span>';
      }
    }

    const countdownInterval = setInterval(updateCountdown, 1000);
  </script>
</body>

</html>
