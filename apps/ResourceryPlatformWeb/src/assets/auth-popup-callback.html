<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Authenticating...</title>
    <style>
      body { margin: 0; display: flex; align-items: center; justify-content: center;
             min-height: 100vh; font-family: sans-serif; background: #f4f4f4; color: #555; }
    </style>
  </head>
  <body>
    <p>Authentication complete. You can close this window.</p>
    <script>
      (function () {
        if (window.opener && window.opener !== window) {
          let targetOrigin = window.location.origin;
          const payload = window.location.hash || (window.location.search ? `#${window.location.search.substring(1)}` : '');

          try {
            if (window.opener.location && window.opener.location.origin) {
              targetOrigin = window.opener.location.origin;
            }
          } catch (error) {
            // Ignore cross-origin access errors; parent will verify sender origin.
          }

          try {
            window.opener.postMessage(payload, targetOrigin);
            window.localStorage.setItem('auth_hash', payload);
          } catch (error) {
            window.opener.postMessage(payload, '*');
            window.localStorage.setItem('auth_hash', payload);
          }
        }
        window.close();
      })();
    </script>
  </body>
</html>
